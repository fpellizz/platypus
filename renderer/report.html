<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report giornaliero · Platypus</title>
<link rel="icon" href="favicon.png">
<style>
  @font-face { font-family: 'PS2P'; src: url('fonts/PressStart2P.woff2') format('woff2'); }
  @font-face { font-family: 'VT'; src: url('fonts/VT323.woff2') format('woff2'); }
  :root { --bg: #0b0a12; --ink: #fff1e8; --dim: #83769c; --yellow: #ffec27; --green: #00e436; --pink: #ff77a8; --red: #ff004d; --blue: #29adff; --orange: #ffa300; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'VT', monospace; font-size: 20px; }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-family: 'PS2P'; font-size: 16px; color: var(--pink); margin: 0 0 6px; }
  h2 { font-family: 'PS2P'; font-size: 11px; color: var(--yellow); margin: 26px 0 10px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 18px; }
  button, input[type=date] { font-family: 'PS2P'; font-size: 9px; color: var(--ink); background: #2a2440; border: 0; padding: 7px 9px; cursor: pointer; box-shadow: inset -2px -2px 0 #000, inset 2px 2px 0 #4a4266; }
  input[type=date] { color-scheme: dark; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile { background: #14111f; border: 3px solid #2a2440; padding: 10px; }
  .tile b { display: block; font-family: 'PS2P'; font-size: 16px; color: var(--yellow); font-weight: normal; margin-bottom: 4px; }
  .tile span { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: 'PS2P'; font-size: 8px; color: var(--dim); text-align: left; padding: 6px; border-bottom: 2px solid #2a2440; }
  td { padding: 5px 6px; border-bottom: 1px solid #1d1a2b; }
  td.n { font-family: 'PS2P'; font-size: 10px; color: var(--yellow); text-align: right; }
  .tag { font-family: 'PS2P'; font-size: 7px; padding: 2px 4px; border: 1px solid currentColor; }
  .rel li { margin: 3px 0; list-style: none; }
  .rel { padding: 0; }
  .rel i { font-style: normal; font-family: 'PS2P'; font-size: 8px; padding: 2px 4px; color: #000; margin-right: 6px; }
  .k-commit { background: var(--green); } .k-pr { background: var(--blue); } .k-merge { background: var(--pink); } .k-tag { background: var(--yellow); } .k-tests { background: var(--green); } .k-push { background: var(--dim); }
  a { color: var(--blue); }
  .honors { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .honor { background: #14111f; border: 3px solid var(--yellow); padding: 10px; }
  .honor h3 { font-family: 'PS2P'; font-size: 8px; color: var(--yellow); margin: 0 0 6px; }
  .dim { color: var(--dim); }
  .empty { color: var(--dim); padding: 10px 0; }
  @media print {
    body { background: #fff; color: #000; font-size: 15px; }
    .bar { display: none; }
    .tile, .honor { border-color: #999; background: #fff; }
    .tile b, h2, h1, td.n, .honor h3 { color: #000; }
    th, .tile span, .dim { color: #555; }
  }
</style>
</head>
<body>
<main>
  <h1>REPORT DELLA GIORNATA</h1>
  <div class="dim" id="sub"></div>
  <div class="bar">
    <button id="prev">&lt; GIORNO PRIMA</button>
    <input type="date" id="day" aria-label="Giorno del report">
    <button id="next">GIORNO DOPO &gt;</button>
    <button id="print">STAMPA / PDF</button>
    <button id="copy">COPIA TESTO</button>
    <button id="mail">INVIA PER MAIL</button>
  </div>
  <div id="out"></div>
</main>
<script src="i18n.js"></script>
<script src="i18n-runtime.js"></script>
<script src="report.js"></script>
</body>
</html>
