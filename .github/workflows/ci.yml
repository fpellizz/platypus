# Checks on Windows, macOS and Linux on every push and pull request.
#  - "engine": npm test with Node 20 and 22 (nothing to install)
#  - "window": installs Electron like a user would, opens the app with the demo,
#    takes a screenshot and saves it among the run's artifacts
# The two groups run independently, so a runner stuck in the queue on one system
# doesn't hold back the others. macOS uses Intel runners: the arm64 ones
# (macos-latest) often never get a machine because of GitHub's capacity limits.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke-test.js

  window:
    name: Window · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies like the launcher does
        run: node scripts/launch.js --setup
      - name: Graphics libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libnotify4 libasound2t64
      - name: Open the window with the demo and take a screenshot
        shell: bash
        env:
          PLATYPUS_SNAPSHOT: ${{ github.workspace }}/snapshot-${{ runner.os }}.png
          PLATYPUS_SNAPSHOT_DELAY: '12000'
          PLATYPUS_PORT: '47811'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            timeout 120 xvfb-run -a npx electron . --demo --no-sandbox
          else
            npx electron . --demo
          fi
          test -s "$PLATYPUS_SNAPSHOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-${{ runner.os }}
          path: snapshot-*.png
          if-no-files-found: warn
